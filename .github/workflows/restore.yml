# Restore ICT-Lab from a weekly backup (s3://ictlab-files/backups/<week>/).
#
# Actions → "Restore ICT-Lab" → Run workflow → type the week (the folder name,
# e.g. 2026-10-25), choose where to restore, type RESTORE to confirm.
#
#   test-run      (default) Restores the week into a TEMPORARY Supabase that
#                 GitHub starts inside this job, checks every table and file
#                 against the backup, and throws it away. Touches nothing
#                 real — use it to prove a backup can be restored.
#   this-project  Replaces ALL data, logins and Storage files of the live
#                 ICT-Lab project with that week's. A safety backup of the
#                 current state is taken first (backups/pre-restore-<time>/),
#                 and the data load is one transaction: if it fails, nothing
#                 changes.
#   new-project   Builds a fresh, empty Supabase project from the backup
#                 (structure + data + files). Needs the secrets RESTORE_DB_URL,
#                 RESTORE_SUPABASE_URL and RESTORE_SERVICE_ROLE_KEY for that
#                 project; the website must then be pointed at it.
name: Restore ICT-Lab

on:
  workflow_dispatch:
    inputs:
      week:
        description: 'Backup folder to restore (e.g. 2026-10-25)'
        required: true
      target:
        description: 'Where to restore'
        type: choice
        options: [test-run, this-project, new-project]
        default: test-run
      confirm:
        description: 'Type RESTORE to confirm'
        required: true

concurrency:
  group: ictlab-backup
  cancel-in-progress: false

permissions:
  contents: read

env:
  LIVE_SUPABASE_URL: https://ilqnwprvxwbhvrjstwsd.supabase.co
  BUCKET: ictlab-files
  AWS_DEFAULT_REGION: us-east-1
  WEEK: ${{ inputs.week }}

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check the request
        run: |
          [ "${{ inputs.confirm }}" = "RESTORE" ] || { echo "Type RESTORE in the confirm box to run a restore."; exit 1; }
          echo "$WEEK" | grep -Eq '^[A-Za-z0-9_-]+$' || { echo "Week must be a backup folder name like 2026-10-25."; exit 1; }

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Prepare the AWS key
        env:
          ID: ${{ secrets.BACKUP_AWS_ACCESS_KEY_ID }}
          SECRET: ${{ secrets.BACKUP_AWS_SECRET_ACCESS_KEY }}
        run: |
          # A pasted key can carry a line break, or a whole line of the .csv.
          # Take the parts that have the shape of an AWS key and say so if
          # there are none (lengths only — never the values).
          RAW_ID="$ID"; RAW_SECRET="$SECRET"
          ID=$(printf %s "$RAW_ID" | grep -oE '(AKIA|ASIA)[A-Z0-9]{16}' | head -1 || true)
          SECRET=$(printf %s "$RAW_SECRET" | grep -oE '[A-Za-z0-9/+]{40}' | head -1 || true)
          [ -n "$ID" ] || { echo "BACKUP_AWS_ACCESS_KEY_ID has no AWS key ID in it (expected AKIA + 16 characters; it holds ${#RAW_ID} characters). Paste only the Access key ID."; exit 1; }
          [ -n "$SECRET" ] || { echo "BACKUP_AWS_SECRET_ACCESS_KEY has no 40-character secret in it (it holds ${#RAW_SECRET} characters). Paste only the Secret access key."; exit 1; }
          [ "${#RAW_ID}" -eq 20 ] || echo "note: the access key ID secret holds ${#RAW_ID} characters, not 20 — using the key found inside it"
          [ "${#RAW_SECRET}" -eq 40 ] || echo "note: the secret key secret holds ${#RAW_SECRET} characters, not 40 — using the key found inside it"
          echo "::add-mask::$ID"; echo "::add-mask::$SECRET"
          { echo "AWS_ACCESS_KEY_ID=$ID"; echo "AWS_SECRET_ACCESS_KEY=$SECRET"; } >> "$GITHUB_ENV"

      - name: Build the database address
        env:
          DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          [ -n "$DB_PASSWORD" ] || { echo "Add the secret SUPABASE_DB_PASSWORD (the database password only)."; exit 1; }
          # Built here, not stored as one long secret: only the password is a
          # secret, and encoding it means any character in it is safe.
          URL=$(node -e 'console.log(`postgresql://postgres.ilqnwprvxwbhvrjstwsd:${encodeURIComponent(process.argv[1])}@aws-1-us-west-2.pooler.supabase.com:5432/postgres`)' "$DB_PASSWORD")
          echo "::add-mask::$URL"
          echo "SUPABASE_DB_URL=$URL" >> "$GITHUB_ENV"

      - name: Start a temporary Supabase (test-run)
        if: inputs.target == 'test-run'
        run: |
          mkdir -p "$RUNNER_TEMP/sb" && cd "$RUNNER_TEMP/sb"
          supabase init > /dev/null
          supabase start > /dev/null
          eval "$(supabase status -o env)"
          echo "::add-mask::$SERVICE_ROLE_KEY"
          { echo "T_DB=$DB_URL"; echo "T_URL=$API_URL"; echo "T_KEY=$SERVICE_ROLE_KEY"; } >> "$GITHUB_ENV"
          echo "temporary Supabase is up (thrown away when this job ends)"

      - name: Choose the target project
        if: inputs.target != 'test-run'
        env:
          LIVE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEW_DB: ${{ secrets.RESTORE_DB_URL }}
          NEW_URL: ${{ secrets.RESTORE_SUPABASE_URL }}
          NEW_KEY: ${{ secrets.RESTORE_SERVICE_ROLE_KEY }}
        run: |
          if [ "${{ inputs.target }}" = "this-project" ]; then
            { echo "T_DB=$SUPABASE_DB_URL"; echo "T_URL=$LIVE_SUPABASE_URL"; echo "T_KEY=$LIVE_KEY"; } >> "$GITHUB_ENV"
          else
            [ -n "$NEW_DB" ] && [ -n "$NEW_URL" ] && [ -n "$NEW_KEY" ] || { echo "Add the secrets RESTORE_DB_URL, RESTORE_SUPABASE_URL and RESTORE_SERVICE_ROLE_KEY for the new project first."; exit 1; }
            { echo "T_DB=$NEW_DB"; echo "T_URL=$NEW_URL"; echo "T_KEY=$NEW_KEY"; } >> "$GITHUB_ENV"
          fi

      - name: Download the backup
        run: |
          aws s3 cp "s3://$BUCKET/backups/$WEEK/" pkg --recursive --only-show-errors
          [ -f pkg/manifest.json ] || { echo "No backup found at backups/$WEEK/"; exit 1; }
          gunzip -k pkg/data.sql.gz
          # auth's migration bookkeeping already exists in any Supabase project
          awk '/^COPY "auth"\."schema_migrations"/{skip=1} skip&&/^\\\.$/{skip=0; next} !skip' pkg/data.sql > pkg/data.load.sql
          node -e 'const m=require(process.argv[1]); console.log(`backup of ${m.made_at}: ${m.rows_total} rows, ${m.auth_users} logins, ${m.storage.files} files`)' "$PWD/pkg/manifest.json"

      - name: Safety backup of the current state
        if: inputs.target == 'this-project'
        env:
          SUPABASE_URL: ${{ env.LIVE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          STAMP="pre-restore-$(date -u +%Y-%m-%d-%H%M)"
          scripts/backup/dump.sh "safety/$STAMP"
          aws s3 cp "safety/$STAMP" "s3://$BUCKET/backups/$STAMP/" --recursive --only-show-errors
          echo "current state saved to backups/$STAMP/ — restore that folder to undo this restore"

      - name: Restore the database
        run: |
          if [ "${{ inputs.target }}" = "this-project" ]; then
            psql "$T_DB" -v ON_ERROR_STOP=1 --single-transaction -q \
              -f scripts/backup/wipe.sql -f pkg/data.load.sql > /dev/null
          else
            psql "$T_DB" -v ON_ERROR_STOP=1 --single-transaction -q \
              -f pkg/roles.sql -f pkg/schema.sql \
              -c 'SET session_replication_role = replica' -f pkg/data.load.sql > /dev/null
          fi
          echo "database restored"

      - name: Restore the files
        env:
          SUPABASE_URL: ${{ env.T_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.T_KEY }}
        run: node scripts/backup/storage.mjs upload pkg/files

      - name: Check it matches the backup
        run: |
          psql "$T_DB" -At -v ON_ERROR_STOP=1 -f scripts/backup/counts.sql > after.json
          node -e '
            const fs = require("fs")
            const want = JSON.parse(fs.readFileSync("pkg/row_counts.json", "utf8"))
            const got = JSON.parse(fs.readFileSync("after.json", "utf8"))
            const off = Object.keys(want).filter(t => t !== "auth.schema_migrations" && Number(got[t] ?? -1) !== Number(want[t]))
            if (off.length) { console.log(`${off.length} table(s) differ from the backup: ${off.join(", ")}`); process.exit(1) }
            console.log(`all ${Object.keys(want).length} tables match the backup`)
          '
