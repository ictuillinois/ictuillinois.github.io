# Weekly backup of ICT-Lab (data, logins and Supabase Storage files) to
# s3://ictlab-files/backups/<date>/ — kept 90 days by an S3 lifecycle rule.
# Restore with the "Restore ICT-Lab" workflow. Scripts: scripts/backup/.
# This repo is PUBLIC: steps print counts only, never data or file names.
name: Weekly backup (ICT-Lab)

on:
  schedule:
    - cron: '17 8 * * 0'   # Sundays 08:17 UTC = 3:17am Chicago (2:17am in winter)
  workflow_dispatch:        # "Run workflow" = back up now

concurrency:
  group: ictlab-backup
  cancel-in-progress: false

permissions:
  contents: read

env:
  SUPABASE_URL: https://ilqnwprvxwbhvrjstwsd.supabase.co
  BUCKET: ictlab-files
  AWS_DEFAULT_REGION: us-east-1

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Prepare the AWS key
        env:
          ID: ${{ secrets.BACKUP_AWS_ACCESS_KEY_ID }}
          SECRET: ${{ secrets.BACKUP_AWS_SECRET_ACCESS_KEY }}
        run: |
          # A pasted key can carry a line break, or a whole line of the .csv.
          # Take the parts that have the shape of an AWS key and say so if
          # there are none (lengths only — never the values).
          RAW_ID="$ID"; RAW_SECRET="$SECRET"
          ID=$(printf %s "$RAW_ID" | grep -oE '(AKIA|ASIA)[A-Z0-9]{16}' | head -1 || true)
          SECRET=$(printf %s "$RAW_SECRET" | grep -oE '[A-Za-z0-9/+]{40}' | head -1 || true)
          [ -n "$ID" ] || { echo "BACKUP_AWS_ACCESS_KEY_ID has no AWS key ID in it (expected AKIA + 16 characters; it holds ${#RAW_ID} characters). Paste only the Access key ID."; exit 1; }
          [ -n "$SECRET" ] || { echo "BACKUP_AWS_SECRET_ACCESS_KEY has no 40-character secret in it (it holds ${#RAW_SECRET} characters). Paste only the Secret access key."; exit 1; }
          [ "${#RAW_ID}" -eq 20 ] || echo "note: the access key ID secret holds ${#RAW_ID} characters, not 20 — using the key found inside it"
          [ "${#RAW_SECRET}" -eq 40 ] || echo "note: the secret key secret holds ${#RAW_SECRET} characters, not 40 — using the key found inside it"
          echo "::add-mask::$ID"; echo "::add-mask::$SECRET"
          { echo "AWS_ACCESS_KEY_ID=$ID"; echo "AWS_SECRET_ACCESS_KEY=$SECRET"; } >> "$GITHUB_ENV"

      - name: Build the database address
        env:
          DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          [ -n "$DB_PASSWORD" ] || { echo "Add the secret SUPABASE_DB_PASSWORD (the database password only)."; exit 1; }
          # Built here, not stored as one long secret: only the password is a
          # secret, and encoding it means any character in it is safe.
          URL=$(node -e 'console.log(`postgresql://postgres.ilqnwprvxwbhvrjstwsd:${encodeURIComponent(process.argv[1])}@aws-1-us-west-2.pooler.supabase.com:5432/postgres`)' "$DB_PASSWORD")
          echo "::add-mask::$URL"
          echo "SUPABASE_DB_URL=$URL" >> "$GITHUB_ENV"

      - name: Make the backup package
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          WEEK=$(date -u +%Y-%m-%d)
          echo "WEEK=$WEEK" >> "$GITHUB_ENV"
          scripts/backup/dump.sh "pkg/$WEEK"

      - name: Upload to S3
        run: |
          aws s3 cp "pkg/$WEEK" "s3://$BUCKET/backups/$WEEK/" --recursive --only-show-errors
          echo "saved to s3://$BUCKET/backups/$WEEK/"

      - name: Tell the super admin
        if: always()
        env:
          KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OUTCOME: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$OUTCOME" = "success" ]; then
            TITLE="Weekly backup saved ($WEEK)"
            BODY=$(node -e 'const m=require(process.argv[1]); console.log(`${m.rows_total} rows in ${m.tables} tables, ${m.auth_users} logins, ${m.storage.files} files. In S3: backups/${process.argv[2]}/`)' "$PWD/pkg/$WEEK/manifest.json" "$WEEK")
          else
            TITLE="Weekly backup FAILED (${WEEK:-today})"
            BODY="Open the run to see why: $RUN_URL"
          fi
          node -e 'process.stdout.write(JSON.stringify({ type: "backup", title: process.argv[1], body: process.argv[2], read: false }))' "$TITLE" "$BODY" > note.json
          curl -s -o /dev/null -w "bell: HTTP %{http_code}\n" -X POST "$SUPABASE_URL/rest/v1/admin_notifications" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" --data @note.json
