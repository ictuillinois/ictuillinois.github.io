<svg width="512" height="512" viewBox="0 0 680 780" xmlns="http://www.w3.org/2000/svg">
  <title>LabHive Logo</title>
  <desc>LabHive logo: navy hexagon with orange border, three field hexagons (physics/atom, mechanics/gears, chemistry) with flask in center hexagon, LabHive wordmark below</desc>

  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Philosopher:wght@700&amp;display=swap');
    </style>
    <clipPath id="centerHexClip">
      <polygon points="0,-136 69,-96 69,-16 0,24 -69,-16 -69,-96"/>
    </clipPath>
  </defs>

  <g transform="translate(340,300)">

    <!-- OUTER HEX -->
    <polygon points="0,-230 199,-115 199,115 0,230 -199,115 -199,-115"
             fill="#0C1140" stroke="#FF6B1A" stroke-width="16" stroke-linejoin="round"/>
    <polygon points="0,-210 182,-105 182,105 0,210 -182,105 -182,-105"
             fill="none" stroke="#FF9A4A" stroke-width="1" opacity="0.15"/>

    <!-- corner small hexagons -->
    <polygon points="0,-224 8,-219 8,-209 0,-204 -8,-209 -8,-219" fill="#FF9A4A"/>
    <polygon points="192,-112 200,-107 200,-97 192,-92 184,-97 184,-107" fill="#FF9A4A"/>
    <polygon points="192,92 200,97 200,107 192,112 184,107 184,97" fill="#FF9A4A"/>
    <polygon points="0,204 8,209 8,219 0,224 -8,219 -8,209" fill="#FF9A4A"/>
    <polygon points="-192,92 -184,97 -184,107 -192,112 -200,107 -200,97" fill="#FF9A4A"/>
    <polygon points="-192,-112 -184,-107 -184,-97 -192,-92 -200,-97 -200,-107" fill="#FF9A4A"/>

    <!-- CENTER HEX - white background layer -->
    <polygon points="0,-136 69,-96 69,-16 0,24 -69,-16 -69,-96"
             fill="#FFFFFF" stroke="#CCCCCC" stroke-width="2"/>

    <!-- LEFT HEX - Physics / Atom - electric purple -->
    <polygon points="-110,-122 -56,-92 -56,-20 -110,10 -164,-20 -164,-92"
             fill="#3A0A6B" stroke="#BB44FF" stroke-width="2.5"/>
    <ellipse cx="-110" cy="-56" rx="40" ry="13" fill="none" stroke="#BB44FF" stroke-width="2"/>
    <ellipse cx="-110" cy="-56" rx="40" ry="13" fill="none" stroke="#BB44FF" stroke-width="2" transform="rotate(60,-110,-56)"/>
    <ellipse cx="-110" cy="-56" rx="40" ry="13" fill="none" stroke="#BB44FF" stroke-width="2" transform="rotate(120,-110,-56)"/>
    <circle cx="-110" cy="-56" r="9"   fill="#9922DD"/>
    <circle cx="-110" cy="-56" r="4.5" fill="#EECCFF"/>
    <circle cx="-110" cy="-43" r="4.5" fill="#FFFFFF"/>
    <circle cx="-148" cy="-63" r="4.5" fill="#FFFFFF"/>
    <circle cx="-72"  cy="-63" r="4.5" fill="#FFFFFF"/>

    <!-- RIGHT HEX - Chemistry / Flask - lime green (flask moved to center) -->
    <polygon points="110,-122 164,-92 164,-20 110,10 56,-20 56,-92"
             fill="#1A4A00" stroke="#88FF00" stroke-width="2.5"/>

    <!-- TOP HEX - Mechanics / 3 Gears - coral -->
    <polygon points="0,-192 54,-162 54,-102 0,-72 -54,-102 -54,-162"
             fill="#7B2010" stroke="#FF6644" stroke-width="2.5"/>

    <!-- GEAR 1 yellow large -->
    <g transform="translate(-16,-144)">
      <circle cx="0" cy="0" r="24" fill="#F5C518" stroke="#1A1A1A" stroke-width="1.8"/>
      <polygon points="-5,-24 5,-24 7,-34 -7,-34" fill="#F5C518" stroke="#1A1A1A" stroke-width="1.2" stroke-linejoin="round"/>
      <polygon points="-5,-24 5,-24 7,-34 -7,-34" fill="#F5C518" stroke="#1A1A1A" stroke-width="1.2" stroke-linejoin="round" transform="rotate(30)"/>
      <polygon points="-5,-24 5,-24 7,-34 -7,-34" fill="#F5C518" stroke="#1A1A1A" stroke-width="1.2" stroke-linejoin="round" transform="rotate(60)"/>
      <polygon points="-5,-24 5,-24 7,-34 -7,-34" fill="#F5C518" stroke="#1A1A1A" stroke-width="1.2" stroke-linejoin="round" transform="rotate(90)"/>
      <polygon points="-5,-24 5,-24 7,-34 -7,-34" fill="#F5C518" stroke="#1A1A1A" stroke-width="1.2" stroke-linejoin="round" transform="rotate(120)"/>
      <polygon points="-5,-24 5,-24 7,-34 -7,-34" fill="#F5C518" stroke="#1A1A1A" stroke-width="1.2" stroke-linejoin="round" transform="rotate(150)"/>
      <polygon points="-5,-24 5,-24 7,-34 -7,-34" fill="#F5C518" stroke="#1A1A1A" stroke-width="1.2" stroke-linejoin="round" transform="rotate(180)"/>
      <polygon points="-5,-24 5,-24 7,-34 -7,-34" fill="#F5C518" stroke="#1A1A1A" stroke-width="1.2" stroke-linejoin="round" transform="rotate(210)"/>
      <polygon points="-5,-24 5,-24 7,-34 -7,-34" fill="#F5C518" stroke="#1A1A1A" stroke-width="1.2" stroke-linejoin="round" transform="rotate(240)"/>
      <polygon points="-5,-24 5,-24 7,-34 -7,-34" fill="#F5C518" stroke="#1A1A1A" stroke-width="1.2" stroke-linejoin="round" transform="rotate(270)"/>
      <polygon points="-5,-24 5,-24 7,-34 -7,-34" fill="#F5C518" stroke="#1A1A1A" stroke-width="1.2" stroke-linejoin="round" transform="rotate(300)"/>
      <polygon points="-5,-24 5,-24 7,-34 -7,-34" fill="#F5C518" stroke="#1A1A1A" stroke-width="1.2" stroke-linejoin="round" transform="rotate(330)"/>
      <circle cx="0" cy="0" r="12" fill="white" stroke="#1A1A1A" stroke-width="1.5"/>
    </g>

    <!-- GEAR 2 red medium -->
    <g transform="translate(18,-118)">
      <circle cx="0" cy="0" r="17" fill="#E84560" stroke="#1A1A1A" stroke-width="1.8"/>
      <polygon points="-4,-17 4,-17 6,-25 -6,-25" fill="#E84560" stroke="#1A1A1A" stroke-width="1.2" stroke-linejoin="round"/>
      <polygon points="-4,-17 4,-17 6,-25 -6,-25" fill="#E84560" stroke="#1A1A1A" stroke-width="1.2" stroke-linejoin="round" transform="rotate(36)"/>
      <polygon points="-4,-17 4,-17 6,-25 -6,-25" fill="#E84560" stroke="#1A1A1A" stroke-width="1.2" stroke-linejoin="round" transform="rotate(72)"/>
      <polygon points="-4,-17 4,-17 6,-25 -6,-25" fill="#E84560" stroke="#1A1A1A" stroke-width="1.2" stroke-linejoin="round" transform="rotate(108)"/>
      <polygon points="-4,-17 4,-17 6,-25 -6,-25" fill="#E84560" stroke="#1A1A1A" stroke-width="1.2" stroke-linejoin="round" transform="rotate(144)"/>
      <polygon points="-4,-17 4,-17 6,-25 -6,-25" fill="#E84560" stroke="#1A1A1A" stroke-width="1.2" stroke-linejoin="round" transform="rotate(180)"/>
      <polygon points="-4,-17 4,-17 6,-25 -6,-25" fill="#E84560" stroke="#1A1A1A" stroke-width="1.2" stroke-linejoin="round" transform="rotate(216)"/>
      <polygon points="-4,-17 4,-17 6,-25 -6,-25" fill="#E84560" stroke="#1A1A1A" stroke-width="1.2" stroke-linejoin="round" transform="rotate(252)"/>
      <polygon points="-4,-17 4,-17 6,-25 -6,-25" fill="#E84560" stroke="#1A1A1A" stroke-width="1.2" stroke-linejoin="round" transform="rotate(288)"/>
      <polygon points="-4,-17 4,-17 6,-25 -6,-25" fill="#E84560" stroke="#1A1A1A" stroke-width="1.2" stroke-linejoin="round" transform="rotate(324)"/>
      <circle cx="0" cy="0" r="9" fill="white" stroke="#1A1A1A" stroke-width="1.5"/>
    </g>

    <!-- GEAR 3 blue small -->
    <g transform="translate(-18,-116)">
      <circle cx="0" cy="0" r="14" fill="#2AABE4" stroke="#1A1A1A" stroke-width="1.8"/>
      <polygon points="-3,-14 3,-14 5,-21 -5,-21" fill="#2AABE4" stroke="#1A1A1A" stroke-width="1.2" stroke-linejoin="round"/>
      <polygon points="-3,-14 3,-14 5,-21 -5,-21" fill="#2AABE4" stroke="#1A1A1A" stroke-width="1.2" stroke-linejoin="round" transform="rotate(36)"/>
      <polygon points="-3,-14 3,-14 5,-21 -5,-21" fill="#2AABE4" stroke="#1A1A1A" stroke-width="1.2" stroke-linejoin="round" transform="rotate(72)"/>
      <polygon points="-3,-14 3,-14 5,-21 -5,-21" fill="#2AABE4" stroke="#1A1A1A" stroke-width="1.2" stroke-linejoin="round" transform="rotate(108)"/>
      <polygon points="-3,-14 3,-14 5,-21 -5,-21" fill="#2AABE4" stroke="#1A1A1A" stroke-width="1.2" stroke-linejoin="round" transform="rotate(144)"/>
      <polygon points="-3,-14 3,-14 5,-21 -5,-21" fill="#2AABE4" stroke="#1A1A1A" stroke-width="1.2" stroke-linejoin="round" transform="rotate(180)"/>
      <polygon points="-3,-14 3,-14 5,-21 -5,-21" fill="#2AABE4" stroke="#1A1A1A" stroke-width="1.2" stroke-linejoin="round" transform="rotate(216)"/>
      <polygon points="-3,-14 3,-14 5,-21 -5,-21" fill="#2AABE4" stroke="#1A1A1A" stroke-width="1.2" stroke-linejoin="round" transform="rotate(252)"/>
      <polygon points="-3,-14 3,-14 5,-21 -5,-21" fill="#2AABE4" stroke="#1A1A1A" stroke-width="1.2" stroke-linejoin="round" transform="rotate(288)"/>
      <polygon points="-3,-14 3,-14 5,-21 -5,-21" fill="#2AABE4" stroke="#1A1A1A" stroke-width="1.2" stroke-linejoin="round" transform="rotate(324)"/>
      <circle cx="0" cy="0" r="7" fill="white" stroke="#1A1A1A" stroke-width="1.5"/>
    </g>

    <!-- OVERLAP COLOR BLEED onto white center -->
    <polygon points="-69,-96 -56,-92 -56,-20 -69,-16" fill="#BB44FF" opacity="0.35"/>
    <polygon points="56,-92 69,-96 69,-16 56,-20"     fill="#88FF00" opacity="0.35"/>
    <polygon points="-54,-102 54,-102 69,-96 0,-136 -69,-96" fill="#FF6644" opacity="0.35"/>

    <!-- FLASK in CENTER HEX (clipped to center hex, drawn on top) -->
    <g clip-path="url(#centerHexClip)">
      <!-- neck -->
      <rect x="-7.8" y="-98.9" width="15.6" height="23.4" rx="3.9"
            fill="none" stroke="#88FF00" stroke-width="3.2"/>
      <!-- top rim -->
      <line x1="-13" y1="-98.9" x2="13" y2="-98.9"
            stroke="#88FF00" stroke-width="4.5" stroke-linecap="round"/>
      <!-- flask body outline -->
      <path d="M-7.8,-75.5 L-33.8,-13.1 L33.8,-13.1 L7.8,-75.5 Z"
            fill="none" stroke="#88FF00" stroke-width="3.2" stroke-linejoin="round"/>
      <!-- liquid fill -->
      <path d="M-31.2,-39.1 L-33.8,-13.1 L33.8,-13.1 L31.2,-39.1 Z"
            fill="#2A7A00" opacity="0.9"/>
      <!-- bubbles -->
      <circle cx="-15.6" cy="-26.1" r="5.2" fill="#88FF00" opacity="0.9"/>
      <circle cx="5.2"   cy="-20.9" r="4.6" fill="#88FF00" opacity="0.7"/>
      <circle cx="23.4"  cy="-27.4" r="3.9" fill="#88FF00" opacity="0.6"/>
    </g>

    <!-- LabHive wordmark - large, inside outer hex -->
    <text x="0" y="130" text-anchor="middle"
          font-family="'Philosopher', Georgia, serif" font-size="64" font-weight="700"
          fill="#F5F0DC">LabHive</text>

  </g>

</svg>
